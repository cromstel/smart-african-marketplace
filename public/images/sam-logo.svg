<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="samGradient" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="170" y2="170">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="textGradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B35" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Transparent background for versatility -->
  
  <!-- Main Circle with gradient -->
  <circle cx="100" cy="100" r="70" fill="url(#samGradient)" filter="url(#shadow)"/>
  
  <!-- Inner ring for depth -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- SAM Text -->
  <text x="100" y="115" 
        font-family="'ADLaMDisplay-Regular', 'ADLaM Display', 'Segoe UI', sans-serif" 
        font-size="48" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="2">SAM</text>
  
  <!-- Accent dots -->
  <circle cx="160" cy="40" r="6" fill="#f5a623"/>
  <circle cx="175" cy="55" r="4" fill="#27ae60"/>
  <circle cx="145" cy="55" r="4" fill="#FF4500"/>
</svg>
