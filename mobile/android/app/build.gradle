plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def websiteBaseUrl = project.findProperty("WEBSITE_BASE_URL") ?: "https://example.com"
def allowedHosts = project.findProperty("ALLOWED_HOSTS") ?: "example.com,www.example.com"

android {
    namespace 'com.africanmarket.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.africanmarket.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "WEBSITE_BASE_URL", "\"${websiteBaseUrl}\""
        buildConfigField "String", "ALLOWED_HOSTS", "\"${allowedHosts}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
