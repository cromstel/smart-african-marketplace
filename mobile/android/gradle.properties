org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35

# =============================================================================
# WEBSITE CONFIGURATION
# =============================================================================
# Base URL the app talks to. Use the production site for release builds.
# For local testing override with: http://10.0.2.2:8000 (Android emulator) or your LAN IP.
WEBSITE_BASE_URL=https://smartafrican-marketplace.cromstelit.com

# App version (single source of truth; kept in sync with the backend mobile_android_version default).
androidVersionName=1.0.0

# Allowed hosts for in-app navigation (comma-separated)
# Include localhost for emulator, LAN IPs for network testing, and production domain
ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,10.0.2.2,192.168.100.32,192.168.161.13,::1,smartafrican-marketplace.cromstelit.com,www.smartafrican-marketplace.cromstelit.com
