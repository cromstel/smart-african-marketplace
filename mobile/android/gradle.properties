org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.suppressUnsupportedCompileSdk=35
android.builtInKotlin=false
kotlin.code.style=official

# =============================================================================
# WEBSITE CONFIGURATION
# =============================================================================
# Set your production URL here when ready for release
# For local testing: http://10.0.2.2:8000 (Android emulator) or your LAN IP

# Development URL (emulator/local network testing) - Android Emulator reaches host machine on 10.0.2.2
WEBSITE_BASE_URL=http://192.168.100.32:8000,http://10.0.2.2:8000

# Production URL (uncomment and set when ready for release)
# WEBSITE_BASE_URL=https://smartafrican-marketplace.cromstelit.com/

# Allowed hosts for in-app navigation (comma-separated)
# Include localhost for emulator, LAN IPs for network testing, and production domain
ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,10.0.2.2,192.168.100.32,192.168.161.13,::1,your-domain.com,www.your-domain.com
android.defaults.buildfeatures.resvalues=true
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.newDsl=false
