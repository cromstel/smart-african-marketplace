name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Dependency vulnerability scan (Composer)
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Setup Node.js (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies (audit only)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --omit=dev

      - name: Dependency vulnerability scan (npm)
        if: ${{ hashFiles('package-lock.json') != '' }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations (sqlite)
        env:
          APP_ENV: production
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          QUEUE_CONNECTION: database
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Run readiness checks (non-strict)
        env:
          APP_ENV: production
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          QUEUE_CONNECTION: database
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          MAIL_HOST: smtp.example.com
          MAIL_USERNAME: ci-user
          MAIL_PASSWORD: ci-pass
        run: php artisan app:verify-readiness

      - name: Run readiness checks (strict, secrets configured)
        if: ${{ secrets.STRIPE_KEY != '' && secrets.STRIPE_SECRET != '' && secrets.PAYSTACK_PUBLIC_KEY != '' && secrets.PAYSTACK_SECRET_KEY != '' }}
        env:
          APP_ENV: production
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          QUEUE_CONNECTION: database
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          MAIL_HOST: smtp.example.com
          MAIL_USERNAME: ci-user
          MAIL_PASSWORD: ci-pass
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: php artisan app:verify-readiness --strict
