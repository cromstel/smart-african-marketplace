name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # composer.json requires ^8.2, so the floor is tested alongside the version
    # deployed. Adding a version here without widening the composer constraint
    # tests something the application does not claim to support.
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: african_market_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, mbstring, pdo_mysql, fileinfo, curl, dom, libxml, xmlwriter, tokenizer
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Blade views use @vite; without public/build/manifest.json every test
      # that renders a view fails with "Vite manifest not found".
      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      # Roadmap 2.4: make coverage visible, not a gate. Only one matrix leg
      # uploads a report -- running pcov twice would just produce two
      # identical artifacts -- and a coverage regression never fails the
      # build on its own; that is a deliberate future decision, not an
      # oversight.
      - name: Run tests with coverage
        if: matrix.php-version == '8.3'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --coverage-clover=coverage.xml --coverage-text

      - name: Run tests
        if: matrix.php-version != '8.3'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

      - name: Upload coverage report
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

