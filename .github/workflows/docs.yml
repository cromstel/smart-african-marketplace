name: Documentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    name: Integrity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails when a document links to a missing file or directory. The checker
      # is dependency-free so this job does not need `npm install`.
      - name: Check documentation links
        run: node user-guide/tools/check-links.mjs
